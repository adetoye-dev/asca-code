<?xml version="1.0" encoding="UTF-8"?>
<!-- ACSA Code mark: a geometric "A" cut as a single filled path so the counter
     and the crossbar stay open at every size. Hand-authored vector — the
     previous asset was a 300 KB bitmap trace that rendered as an empty box. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ACSA Code">
  <title>ACSA Code</title>
  <defs>
    <linearGradient id="acsa-mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <path fill="url(#acsa-mark)" fill-rule="evenodd" d="M512 150 L914 874 L738 874 L667 712 L357 712 L286 874 L110 874 Z M512 360 L619 604 L405 604 Z"/>
</svg>
