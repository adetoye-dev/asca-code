<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ACSA Code">
  <title>ACSA Code — Flow</title>
  <desc>Direction: drawn, not built. The reference's sweeping right side becomes the whole idea — an asymmetric A where one leg curves. Stroke weight is set for 16px, not for the large size.</desc>
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" x1="0" y1="1024" x2="1024" y2="0" id="flow-mark">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#flow-mark)" stroke-width="140" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 170 L332 700"/>
    <path d="M512 170 Q 740 400 792 700"/>
    <path d="M378 560 L672 560"/>
  </g>
</svg>
