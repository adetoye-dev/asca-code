<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ACSA Code">
  <title>ACSA Code — Apex</title>
  <desc>Direction: solid and grounded. The reference's two structural ideas — a sharp apex and a plane underneath — with the interior detail dropped, because that detail is what stops it working at 16px.</desc>
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" x1="0" y1="1024" x2="1024" y2="0" id="apex-mark">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- The plane: an isometric diamond, read as the surface work stands on. -->
  <path fill="url(#apex-mark)" opacity="0.55" d="M512 884 L944 668 L512 452 L80 668 Z"/>
  <!-- The A: one filled path, so the counter and the leg gap stay open at any size. -->
  <path fill="url(#apex-mark)" fill-rule="evenodd" d="M512 96 L784 700 L628 700 L512 452 L396 700 L240 700 Z"/>
</svg>
