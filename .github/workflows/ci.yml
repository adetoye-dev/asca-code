name: CI

on:
  # Named branches rather than `**`: every push used to start a full build,
  # including on throwaway branches, and macOS minutes are the scarce resource.
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck, tests, build)
    runs-on: ubuntu-latest
    env:
      # `vite build` peaks above the ~2 GB heap Node gives the runner by default
      # and dies with exit 134 (SIGABRT, "Ineffective mark-compacts near heap
      # limit"). A dev machine survives because Node sizes its default heap from
      # total RAM, so this only ever broke in CI.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      # `npm run verify` is typecheck (both tsconfigs) plus the Python suite.
      # The engine is stdlib-only, so the tests need nothing else installed.
      - name: Verify
        run: npm run verify

      # A dependency bump that forgets to regenerate the notices would ship
      # binaries with missing attributions.
      - name: Third-party notices are current
        run: npm run notices:check

      - name: Production build
        run: npm run build

  sidecar:
    name: Frozen engine sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # The app ships this binary so users need no Python install; if it stops
      # building, the packaged app stops working, so it is gated here.
      - name: Build acsa-engine
        run: scripts/build_engine_sidecar.sh

      - name: Every entry point imports (source mode)
        run: python3 core-engine/acsa_engine.py selftest

      - name: Sidecar answers each subcommand
        run: |
          set -euo pipefail
          BIN=".tauri/engine/acsa-engine/acsa-engine"
          export ACSA_DATA_DIR="$(mktemp -d)"
          # Fails loudly if the freeze dropped a module — `pty` was silently
          # missing once and only surfaced when a user opened the terminal.
          "$BIN" selftest
          "$BIN" db info
          "$BIN" db settings.set '{"key":"ci","value":true}'
          "$BIN" db settings.get | grep -q '"ci": true'
          "$BIN" index --project-root . --json > /dev/null
          echo "sidecar OK"

  desktop:
    name: Desktop bundle
    runs-on: macos-latest
    needs: [verify]
    env:
      # Inherited by `tauri build`'s beforeBuildCommand (`npm run build`).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .tauri

      - run: npm ci

      - name: Build the engine sidecar
        run: scripts/build_engine_sidecar.sh

      # After the sidecar, not before: `cargo test` runs Tauri's build script,
      # which validates that every `bundle.resources` path exists — and
      # `.tauri/engine/` is gitignored, so before this step the build dies with
      # "resource path `engine` doesn't exist" and the job fails in 90 seconds.
      # That is exactly what it did on every push until this moved.
      - name: Rust tests
        run: cargo test --manifest-path .tauri/Cargo.toml

      - name: Fetch the Codex agent runtime
        run: scripts/fetch_codex_sidecar.sh

      - name: Bundle the app
        working-directory: .tauri
        run: ../node_modules/.bin/tauri build --bundles app

      # Guards the failure that shipped for months unnoticed: a bundle that
      # builds but cannot find its engine, or panics on launch from bad plugin
      # config. Both were only caught by actually running the thing.
      - name: The bundle contains the engine and starts
        run: |
          set -euo pipefail
          APP=".tauri/target/release/bundle/macos/ACSA Code.app"
          # `acsa_engine.py` is the entry point the Rust side falls back to when
          # there is no frozen binary. This used to name `manager.py`, which the
          # harness removal deleted — so the job failed on a file that was
          # supposed to be gone.
          test -f "$APP/Contents/Resources/core-engine/acsa_engine.py"
          test -x "$APP/Contents/Resources/engine/acsa-engine/acsa-engine"
          # MIT needs the notice to accompany the binary, and OFL needs the font
          # licence to travel with the font. Both live inside the bundle.
          test -f "$APP/Contents/Resources/LICENSE"
          grep -q "SIL OPEN FONT LICENSE" "$APP/Contents/Resources/THIRD-PARTY-NOTICES.md"
          "$APP/Contents/MacOS/acsa-code" > /tmp/launch.log 2>&1 &
          PID=$!
          sleep 12
          kill "$PID" 2>/dev/null || true
          grep -q "Engine dir" /tmp/launch.log || (cat /tmp/launch.log; exit 1)
          echo "bundle launches and resolves its engine"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ACSA-Code-macos-app
          path: .tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14
