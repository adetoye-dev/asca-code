[package]
name = "acsa-code"
version = "0.2.5"
edition = "2021"
description = "ACSA Code — local-first AI engineering workbench with deterministic verification"
license = "MIT"
repository = "https://github.com/adetoye-dev/asca-code"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tauri-plugin-updater = "2.11.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
